name: Validate pipeline and capture dashboard screenshot

on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/dashboard.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Run ETL pipeline and SQL analytics
        run: |
          python etl_pipeline.py
          python sql_analytics.py

      - name: Launch dashboard and capture screenshot
        run: |
          mkdir -p screenshots
          python - <<'PY'
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          log_path = Path("streamlit-ci.log")
          with log_path.open("w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  [
                      sys.executable, "-m", "streamlit", "run", "app.py",
                      "--server.headless", "true",
                      "--server.port", "8501",
                      "--browser.gatherUsageStats", "false",
                  ],
                  stdout=log,
                  stderr=subprocess.STDOUT,
              )

          try:
              health_url = "http://127.0.0.1:8501/_stcore/health"
              for _ in range(60):
                  if process.poll() is not None:
                      raise RuntimeError("Streamlit exited before becoming healthy.")
                  try:
                      with urllib.request.urlopen(health_url, timeout=2) as response:
                          if response.status == 200:
                              break
                  except (urllib.error.URLError, TimeoutError):
                      time.sleep(1)
              else:
                  raise TimeoutError("Streamlit did not become healthy within 60 seconds.")

              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch()
                  page = browser.new_page(
                      viewport={"width": 1600, "height": 1100},
                      device_scale_factor=1,
                  )
                  page.goto("http://127.0.0.1:8501", wait_until="domcontentloaded", timeout=60000)
                  page.get_by_text("Automated Business Insights", exact=False).first.wait_for(timeout=30000)
                  page.wait_for_timeout(2500)
                  page.screenshot(
                      path="screenshots/dashboard.png",
                      full_page=True,
                      animations="disabled",
                  )
                  browser.close()
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
          PY

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/dashboard.png
          if git diff --cached --quiet; then
            echo "Screenshot is unchanged."
          else
            git commit -m "chore: refresh dashboard screenshot"
            git push
          fi
